<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1250" viewBox="0 0 1600 1250">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#57606a"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0969da"/>
    </marker>
    <style>
      text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1f2328; }
      .t { font-size: 30px; font-weight: 700; }
      .st { font-size: 16px; fill: #57606a; }
      .h { font-size: 16px; font-weight: 700; }
      .s { font-size: 13.5px; }
      .m { font-size: 12.5px; fill: #57606a; }
      .k { font-size: 12.5px; fill: #57606a; }
      .c { font-family: Menlo, Monaco, monospace; font-size: 12.5px; }
      .n { font-size: 13px; font-weight: 700; fill: #ffffff; }
      .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
      .ext { fill: #ffffff; stroke: #8c959f; stroke-width: 1.5; }
      .loop { fill: #ddf4ff; stroke: #54aeff; stroke-width: 1.5; }
      .ctx { fill: #fff8c5; stroke: #d4a72c; stroke-width: 1.5; }
      .mem { fill: #dafbe1; stroke: #4ac26b; stroke-width: 1.5; }
      .ln { stroke: #57606a; stroke-width: 1.6; fill: none; }
      .lb { stroke: #0969da; stroke-width: 1.6; fill: none; }
    </style>
  </defs>

  <rect width="1600" height="1250" fill="#ffffff"/>

  <text class="t" x="40" y="52">five — architecture</text>
  <text class="st" x="40" y="80">One agent in a loop that never stops. It reads and rewrites its own context, keeps notes in its memory, and builds its own tools.</text>

  <!-- Outside: browser and Ollama -->
  <rect class="ext" x="40" y="110" width="460" height="140" rx="10"/>
  <text class="h" x="60" y="138">Web UI · web/ (Preact + Vite)</text>
  <text class="s" x="60" y="161">Loop — controls, window meter, every turn live</text>
  <text class="s" x="60" y="180">Context — edit the prompts and messages, start over</text>
  <text class="s" x="60" y="199">Tools — what the agent built, with source</text>
  <text class="s" x="60" y="218">Workspace — its files and databases, read and edit</text>
  <text class="m" x="60" y="240">your browser · served by five from web/dist</text>

  <rect class="ext" x="1180" y="110" width="380" height="140" rx="10"/>
  <text class="h" x="1200" y="138">Ollama · on the host</text>
  <text class="s" x="1200" y="164">qwen3.5:9b · tool calls · optional thinking</text>
  <text class="s" x="1200" y="186">window: FIVE_CONTEXT_TOKENS (32,768)</text>
  <text class="m" x="1200" y="232">from Docker: host.docker.internal:11434</text>

  <!-- Legend -->
  <line class="ln" x1="560" y1="150" x2="610" y2="150" marker-end="url(#a)"/>
  <text class="k" x="622" y="154">calls and data</text>
  <line class="lb" x1="560" y1="178" x2="610" y2="178" marker-end="url(#b)"/>
  <text class="k" x="622" y="182">the turn cycle</text>
  <line class="ln" x1="560" y1="206" x2="610" y2="206" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text class="k" x="622" y="210">a run calling back into five</text>

  <!-- Docker -->
  <rect x="40" y="290" width="1520" height="940" rx="14" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text class="m" x="60" y="1220">Docker container · compose service five · port 5555 published on FIVE_PUBLISH (0.0.0.0) · ./workspace mounted at /workspace</text>

  <!-- five process -->
  <rect x="60" y="330" width="1040" height="868" rx="12" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/>
  <text class="h" x="80" y="356">five · one Node 24 process · src/main.ts → src/app.ts</text>

  <!-- API -->
  <rect class="box" x="80" y="372" width="440" height="100" rx="8"/>
  <text class="h" x="98" y="398">HTTP API · src/api/server.ts</text>
  <text class="s" x="98" y="422">loop: start · pause · stop · step</text>
  <text class="s" x="98" y="442">context: read · edit · reset (clean) — refused during a turn</text>
  <text class="s" x="98" y="462">status · events · tools · workspace files and databases</text>

  <!-- Loop -->
  <rect class="loop" x="80" y="492" width="520" height="408" rx="8"/>
  <text class="h" x="98" y="518">Supervisor loop · src/agent/loop.ts</text>

  <circle cx="118" cy="555" r="11" fill="#0969da"/><text class="n" x="118" y="560" text-anchor="middle">1</text>
  <text class="s" x="138" y="553">The next prompt becomes a user message</text>
  <text class="m" x="138" y="571">led by a [five] warning when the last call filled &gt; 60% of the window</text>

  <circle cx="118" cy="609" r="11" fill="#0969da"/><text class="n" x="118" y="614" text-anchor="middle">2</text>
  <text class="s" x="138" y="607">Model call: system prompt + every message + the tool list</text>
  <text class="m" x="138" y="625">tool calls the model writes as text are recovered (src/llm/textcalls.ts)</text>

  <circle cx="118" cy="663" r="11" fill="#0969da"/><text class="n" x="118" y="668" text-anchor="middle">3</text>
  <text class="s" x="138" y="661">Each tool call runs; its result is appended</text>
  <text class="m" x="138" y="679">a run's result &gt; 3,000 chars is kept in results/, its start appended</text>

  <circle cx="118" cy="717" r="11" fill="#0969da"/><text class="n" x="118" y="722" text-anchor="middle">4</text>
  <text class="s" x="138" y="715">Back to 2, until end_turn, a reply without a call, or 30 steps</text>
  <text class="m" x="138" y="733">each step's call and results are saved and logged as they happen</text>

  <circle cx="118" cy="771" r="11" fill="#0969da"/><text class="n" x="118" y="776" text-anchor="middle">5</text>
  <text class="s" x="138" y="769">end_turn(summary, next): the turn's messages fold into the summary</text>
  <text class="m" x="138" y="787">next becomes the next turn's prompt; without it the same prompt repeats</text>

  <path class="lb" d="M 107 771 L 92 771 L 92 555 L 104 555" marker-end="url(#b)"/>
  <path class="lb" d="M 584 717 L 590 717 L 590 609 L 580 609" marker-end="url(#b)"/>

  <line x1="98" y1="815" x2="582" y2="815" stroke="#54aeff" stroke-width="1"/>
  <text class="s" x="98" y="840">Guards: 3 turns in a row without a tool call pause the loop</text>
  <text class="m" x="98" y="861">a failed turn backs off 5 s → 60 s · the loop resumes after a restart if it was running</text>
  <text class="m" x="98" y="881">otherwise five adds nothing: the context is the agent's</text>

  <!-- Context -->
  <rect class="ctx" x="660" y="372" width="420" height="188" rx="8"/>
  <text class="h" x="678" y="398">Context — the agent's to rewrite</text>
  <text class="s" x="678" y="424">system prompt: Goal · how to work · State · Lessons</text>
  <text class="s" x="678" y="446">messages: every turn's, until deleted or folded</text>
  <text class="s" x="678" y="468">next prompt · turn number</text>
  <text class="m" x="678" y="496">seeded by src/agent/prompt.ts; a reset starts over from it</text>
  <text class="m" x="678" y="516">changes apply from the next model call</text>
  <text class="m" x="678" y="536">Ollama drops the oldest text when it overflows</text>

  <!-- State -->
  <rect class="box" x="660" y="580" width="420" height="160" rx="8"/>
  <text class="h" x="678" y="606">State · src/state.ts</text>
  <text class="s" x="678" y="630">SQLite: workspace/.five/five.db</text>
  <text class="s" x="678" y="652">meta — the context, whether the loop runs</text>
  <text class="s" x="678" y="674">events — the log the web UI follows</text>
  <text class="s" x="678" y="696">tools · runs · tool_runs</text>
  <text class="m" x="678" y="722">saved after every change</text>

  <!-- Runner -->
  <rect class="box" x="660" y="760" width="420" height="140" rx="8"/>
  <text class="h" x="678" y="786">Runner · src/runner</text>
  <text class="s" x="678" y="810">bundles with esbuild, installs npm packages</text>
  <text class="s" x="678" y="832">one Node child process per run</text>
  <text class="s" x="678" y="854">timeout 60 s · heap 1 GB · no permission model</text>
  <text class="m" x="678" y="880">background runs: start_tool · wait_run · kill_run</text>

  <!-- Tools -->
  <rect class="box" x="80" y="920" width="1000" height="258" rx="8"/>
  <text class="h" x="98" y="946">Tools sent with every model call</text>

  <rect class="ctx" x="98" y="962" width="378" height="200" rx="6"/>
  <text class="h" x="112" y="986">Context · src/agent/context.ts</text>
  <text class="c" x="112" y="1012">read_context</text>
  <text class="c" x="112" y="1034">set_system_prompt · edit_system_prompt</text>
  <text class="c" x="112" y="1056">edit_message · insert_message</text>
  <text class="c" x="112" y="1078">delete_messages</text>
  <text class="c" x="112" y="1100">set_next_prompt</text>
  <text class="c" x="112" y="1122">end_turn(summary, next)</text>
  <text class="m" x="112" y="1148">change the context in memory</text>

  <rect class="mem" x="490" y="962" width="160" height="200" rx="6"/>
  <text class="h" x="504" y="986">Memory</text>
  <text class="c" x="504" y="1012">memory_write</text>
  <text class="c" x="504" y="1034">memory_read</text>
  <text class="m" x="504" y="1126">notes that outlive</text>
  <text class="m" x="504" y="1146">the context</text>

  <rect class="box" x="664" y="962" width="398" height="200" rx="6" fill="#ffffff"/>
  <text class="h" x="678" y="986">seven's · src/agent/builtins</text>
  <text class="c" x="678" y="1012">run_js · sql</text>
  <text class="c" x="678" y="1034">define_tool · read_tool · delete_tool</text>
  <text class="c" x="678" y="1056">start_tool · run_status · wait_run</text>
  <text class="c" x="678" y="1078">kill_run · list_runs</text>
  <text class="c" x="678" y="1100">tool_health · disable_tool · enable_tool</text>
  <text class="h" x="678" y="1130">+ the agent's own tools</text>
  <text class="m" x="678" y="1150">src/tools/store.ts · in .five/tools/&lt;name&gt;</text>

  <!-- Right column: child processes and workspace -->
  <rect class="box" x="1140" y="760" width="400" height="200" rx="8" fill="#ffffff"/>
  <text class="h" x="1158" y="786">Child processes · one per run</text>
  <text class="s" x="1158" y="810">run_js code and the agent's own tools</text>
  <text class="s" x="1158" y="832">an ES module · all of Node · any npm package</text>
  <text class="s" x="1158" y="854">working directory: the workspace</text>
  <text class="s" x="1158" y="886">calls back into five:</text>
  <text class="c" x="1158" y="908">five.llm.chat · five.db · five.tools.&lt;name&gt;</text>

  <rect class="mem" x="1140" y="980" width="400" height="198" rx="8"/>
  <text class="h" x="1158" y="1006">Workspace · /workspace</text>
  <text class="c" x="1158" y="1032">memory/*.md</text><text class="s" x="1278" y="1032">the agent's notes</text>
  <text class="c" x="1158" y="1054">results/</text><text class="s" x="1278" y="1054">long results of runs</text>
  <text class="c" x="1158" y="1076">…</text><text class="s" x="1278" y="1076">whatever the agent makes</text>
  <text class="c" x="1158" y="1098">.five/</text><text class="s" x="1278" y="1098">five.db · tools/ · node_modules</text>
  <text class="s" x="1278" y="1120">five.log</text>
  <text class="m" x="1158" y="1150">read and edited from the web UI, all but .five</text>
  <text class="m" x="1158" y="1168">a clean reset empties it all but .five</text>

  <!-- Arrows -->
  <!-- browser ⇄ API -->
  <line class="ln" x1="470" y1="250" x2="470" y2="372" marker-start="url(#a)" marker-end="url(#a)"/>
  <text class="k" x="482" y="276">REST /api/v1 · JSON · polled every second</text>
  <!-- API → loop -->
  <line class="ln" x1="300" y1="472" x2="300" y2="492" marker-end="url(#a)"/>
  <!-- loop ⇄ Ollama -->
  <path class="ln" d="M 540 492 L 540 318 L 1250 318 L 1250 250" marker-start="url(#a)" marker-end="url(#a)"/>
  <text class="k" x="1262" y="276">POST /api/chat · streamed</text>
  <!-- loop ⇄ context -->
  <line class="ln" x1="600" y1="520" x2="660" y2="520" marker-start="url(#a)" marker-end="url(#a)"/>
  <!-- context → state -->
  <line class="ln" x1="870" y1="560" x2="870" y2="580" marker-end="url(#a)"/>
  <!-- loop → state (events) -->
  <line class="ln" x1="600" y1="660" x2="660" y2="660" marker-end="url(#a)"/>
  <text class="k" x="606" y="652">events</text>
  <!-- loop → runner -->
  <line class="ln" x1="600" y1="830" x2="660" y2="830" marker-end="url(#a)"/>
  <text class="k" x="611" y="822">runs</text>
  <!-- loop → tools -->
  <line class="ln" x1="300" y1="900" x2="300" y2="920" marker-end="url(#a)"/>
  <!-- runner → children, and the bridge back -->
  <line class="ln" x1="1080" y1="810" x2="1140" y2="810" marker-end="url(#a)"/>
  <text class="k" x="1120" y="801" text-anchor="middle">spawn</text>
  <line class="ln" x1="1140" y1="900" x2="1080" y2="900" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <!-- children → workspace -->
  <line class="ln" x1="1340" y1="960" x2="1340" y2="980" marker-end="url(#a)"/>
  <!-- memory → workspace -->
  <path class="ln" d="M 570 1162 L 570 1188 L 1120 1188 L 1120 1028 L 1140 1028" marker-end="url(#a)"/>
</svg>
